<div class="board" board-grid="grid">
    <span class="card"
          ng-repeat="card in cards track by card.id"
          card-pos="card"
          ng-click="rotate(card)"
          ng-class="{'show': isOpen(card), 'leaving': card.leaving}">
        <span class="front" card-back></span>
        <span class="back" ng-bind="card.v"></span>
    </span>
</div>
<p ng-class="{'win': checkWin()}">
    <span ng-if="checkWin()">You WON in</span>
    <span ng-bind="steps"></span> moves
</p>
